<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>Tic-Tac-Toe</h1>

        <p class="subtitle">Play against a friend or challenge the AI</p>

        <div class="mode-buttons">
            <button id="twoPlayerBtn" class="mode-btn active">
                2 Players
            </button>

            <button id="aiBtn" class="mode-btn">
                Play vs AI
            </button>
        </div>

        <div class="score-board">
            <div>
                <span>Player X</span>
                <strong id="scoreX">0</strong>
            </div>

            <div>
                <span>Draws</span>
                <strong id="scoreDraw">0</strong>
            </div>

            <div>
                <span>Player O</span>
                <strong id="scoreO">0</strong>
            </div>
        </div>

        <div id="status">Player X's Turn</div>

        <div class="board" id="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </div>

        <button id="resetBtn" class="reset-btn">
            New Game
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
