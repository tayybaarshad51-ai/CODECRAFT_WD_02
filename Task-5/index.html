<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <div class="header">
            <h1>Weather App</h1>
            <p>Check current weather anywhere in the world</p>
        </div>


        <!-- Search Section -->

        <div class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >

            <button id="searchBtn">
                Search
            </button>

            <button id="locationBtn">
                📍 My Location
            </button>

        </div>


        <!-- Loading -->

        <div id="loading" class="loading">
            Loading weather...
        </div>


        <!-- Error -->

        <div id="errorMessage" class="error-message">
        </div>


        <!-- Weather Information -->

        <div id="weatherContainer" class="weather-container">

            <div class="location-info">

                <h2 id="cityName">City</h2>

                <p id="countryName">Country</p>

                <p id="dateTime">Date and Time</p>

            </div>


            <div class="main-weather">

                <div class="weather-icon" id="weatherIcon">
                    ☀️
                </div>

                <div>

                    <div class="temperature">
                        <span id="temperature">--</span>°C
                    </div>

                    <div id="weatherDescription" class="description">
                        Weather Condition
                    </div>

                    <div class="feels-like">
                        Feels like
                        <span id="feelsLike">--</span>°C
                    </div>

                </div>

            </div>


            <!-- Weather Details -->

            <div class="weather-details">

                <div class="weather-card">

                    <div class="detail-icon">
                        💧
                    </div>

                    <div>
                        <p>Humidity</p>
                        <strong>
                            <span id="humidity">--</span>%
                        </strong>
                    </div>

                </div>


                <div class="weather-card">

                    <div class="detail-icon">
                        💨
                    </div>

                    <div>
                        <p>Wind Speed</p>
                        <strong>
                            <span id="windSpeed">--</span> km/h
                        </strong>
                    </div>

                </div>


                <div class="weather-card">

                    <div class="detail-icon">
                        🌧️
                    </div>

                    <div>
                        <p>Precipitation</p>
                        <strong>
                            <span id="precipitation">--</span> mm
                        </strong>
                    </div>

                </div>


                <div class="weather-card">

                    <div class="detail-icon">
                        ☁️
                    </div>

                    <div>
                        <p>Cloud Cover</p>
                        <strong>
                            <span id="cloudCover">--</span>%
                        </strong>
                    </div>

                </div>

            </div>


            <!-- Refresh Button -->

            <button id="refreshBtn" class="refresh-btn">
                🔄 Refresh Weather
            </button>

        </div>

    </div>


    <footer>
        Weather data provided by Open-Meteo
    </footer>


    <script src="script.js"></script>

</body>
</html>
